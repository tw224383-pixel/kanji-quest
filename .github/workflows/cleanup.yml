name: Cleanup Stuck Deployment

on:
  push:
    branches:
      - main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: List and delete deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching deployments..."
          deployments=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/deployments")
          
          echo "$deployments" | jq -c '.[]' | while read -r deployment; do
            id=$(echo "$deployment" | jq -r '.id')
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              echo "Setting deployment $id to inactive..."
              curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -d '{"state":"inactive"}' \
                "https://api.github.com/repos/${{ github.repository }}/deployments/$id/statuses"
              
              echo "Deleting deployment $id..."
              curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/deployments/$id"
            fi
          done
          echo "Cleanup complete."
